name: build-windows

# Builds the Sensorium Windows .msi on a GitHub-hosted Windows 2022
# Server runner and uploads the artefact. Three trigger modes:
#
#   1. workflow_dispatch (manual)  — most common path for ad-hoc
#      v0.1.x builds. Go to the Actions tab → "build-windows" → "Run
#      workflow", pick a branch (typically the version branch like
#      v0.1.7), optionally pass a release-tag input to attach the
#      built .msi to an existing GitHub Release. Without a tag input
#      the .msi is uploaded as a workflow artefact (downloadable from
#      the run page, retained per repo settings — default 90 days).
#
#   2. push to a v* tag  — the cadence path. When a release is tagged
#      and pushed (e.g., `git push origin v0.1.7`), this workflow
#      auto-triggers, builds, and attaches the .msi to the matching
#      GitHub Release if one exists.
#
#   3. pull_request — opt-in via path filter so we don't run on
#      every doc-only PR. The path filter restricts auto-runs to PRs
#      that touch Rust source, frontend assets, packaging config,
#      flavour JSON, or the workflow itself.
#
# Why GitHub Actions over a local Windows VM:
#   • No Windows machine to maintain. The runner is Microsoft-managed.
#   • Builds the x86_64 .msi natively (no ARM-on-Mac emulation tax).
#   • Free for public repositories. `koherarchitecture/sensorium`
#     qualifies.
#   • Same workflow file ships with the repo, so every future release
#     gets a Windows build automatically without per-host briefs.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Optional release tag to attach the .msi to (e.g., v0.1.7). Leave empty to upload as workflow artefact only.'
        required: false
        type: string
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'flavours/**'
      - 'packaging/**'
      - 'package.json'
      - 'tauri.conf.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write  # so the workflow can attach the .msi to a GitHub Release on tag push

jobs:
  build:
    name: Build Windows x86_64 .msi
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust toolchain (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry, git, target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: npm install
        run: npm install

      - name: Confirm vendored koher-ui.css is present
        shell: pwsh
        run: |
          if (-not (Test-Path "src/assets/koher-ui.css")) {
            Write-Error "src/assets/koher-ui.css missing — the v0.1.7+ branches vendor this file because /ui-system/ is outside the repo."
            exit 1
          }
          $size = (Get-Item "src/assets/koher-ui.css").Length
          Write-Host "koher-ui.css present ($size bytes)"

      - name: Build .msi
        # Tauri 2 auto-downloads WiX 3.x on first run, caches it under
        # ~/.cargo/. The first build of a fresh runner pays ~30 s for
        # this; subsequent runs reuse the cached toolchain.
        run: npx tauri build --bundles msi --target x86_64-pc-windows-msvc

      - name: Locate built .msi
        id: find-msi
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) {
            Write-Error "No .msi found under src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/"
            exit 1
          }
          $hash = (Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLower()
          $sizeMb = [math]::Round($msi.Length / 1MB, 2)
          Write-Host "Built: $($msi.Name) ($sizeMb MB) SHA256 $hash"
          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($msi.Name)"     >> $env:GITHUB_OUTPUT
          "sha256=$hash"          >> $env:GITHUB_OUTPUT
          "size_mb=$sizeMb"       >> $env:GITHUB_OUTPUT

      - name: Build summary
        shell: pwsh
        run: |
          "## Sensorium Windows .msi"                                              >> $env:GITHUB_STEP_SUMMARY
          ""                                                                       >> $env:GITHUB_STEP_SUMMARY
          "| Field   | Value |"                                                    >> $env:GITHUB_STEP_SUMMARY
          "|---------|-------|"                                                    >> $env:GITHUB_STEP_SUMMARY
          "| File    | ${{ steps.find-msi.outputs.name }} |"                       >> $env:GITHUB_STEP_SUMMARY
          "| Size    | ${{ steps.find-msi.outputs.size_mb }} MB |"                 >> $env:GITHUB_STEP_SUMMARY
          "| SHA-256 | `${{ steps.find-msi.outputs.sha256 }}` |"                   >> $env:GITHUB_STEP_SUMMARY

      - name: Upload as workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-msi.outputs.name }}
          path: ${{ steps.find-msi.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      # Attach to GitHub Release when the workflow was triggered by
      # a tag push (the cadence path).
      - name: Attach to GitHub Release (tag-push trigger)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-msi.outputs.path }}
          fail_on_unmatched_files: true

      # Attach to a named release when the workflow was manually
      # triggered with the release-tag input set (e.g., manually
      # backfilling a Windows .msi onto an already-cut release).
      - name: Attach to specified release (workflow_dispatch with input)
        if: github.event_name == 'workflow_dispatch' && inputs.release-tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release-tag }}
          files: ${{ steps.find-msi.outputs.path }}
          fail_on_unmatched_files: true
